app = "prawdowid-hacknation"
primary_region = "fra"

[env]
  PRAWDOWID_ENV = "production"
  PRAWDOWID_DATA_DIR = "/data"
  PRAWDOWID_CORPUS = "/srv/prawdowid/Research/Prawdowid_Korpus_Probny.jsonl"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
